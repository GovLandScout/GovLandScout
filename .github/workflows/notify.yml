name: Notification bell

# Finalizes the site's notification bell state right after scrape.yml
# finishes -- was a fixed "1 hour later" cron offset instead of this, but
# GitHub's schedule triggers aren't guaranteed to fire at their nominal
# time (each can drift independently under load), and on 2026-07-29 the
# two drifted close enough together that this ran 3 minutes BEFORE that
# day's scrape actually finished, catching a 6-of-14-scrapers-run batch
# and reporting it as final ("2 of 6 scraper(s) failed"). workflow_run
# ties this to scrape.yml's actual completion instead of a guessed offset,
# which removes the race entirely rather than just widening the buffer.

on:
  workflow_run:
    workflows: ["Scheduled scrape"]
    types:
      - completed
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Summarize latest scrape run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python notify_bell.py
