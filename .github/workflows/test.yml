name: Tests

# Runs the unit test suite (tests/) on every push and PR against main --
# unlike scrape.yml, this doesn't touch the live database or any external
# site, so it's cheap enough to run on every change rather than on a
# schedule.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t .
