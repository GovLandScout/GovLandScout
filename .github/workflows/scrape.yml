name: Scheduled scrape

# Runs all scrapers on a schedule and writes to the same Postgres database
# the live site reads from (see combined_db.py). Deliberately NOT run as
# part of the Render web service's startup anymore -- a full run takes
# 12-20+ minutes (PBFCM and MVBA are both slow, crawl-delay-bound scrapes),
# which used to exceed Render's boot timeout and leave the site serving
# whatever partial data existed when the boot got killed.

on:
  schedule:
    - cron: "0 12 * * *"  # ~7am US Central (adjust for your timezone/DST as needed)
  workflow_dispatch: {}  # allows manually triggering a run from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Was 20 -- on 2026-08-02 the run finished (all scrapers + geocode_backfill +
    # build_home_cache) at 20m9s, just 2s past the old limit, getting the last
    # step's own result cancelled before it could be recorded. 35 gives real
    # headroom now that govease_scraper.py/collin_scraper.py are also in the
    # SCRAPERS list, not just enough for today's exact timing.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all scrapers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python run_daily_scrapers.py
